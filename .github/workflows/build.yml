name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Engine tests
        run: |
          cmake -S . -B build-tests -DTROSS_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests -j
          mkdir -p renders && ./build-tests/engine_test renders
      - uses: actions/upload-artifact@v4
        with:
          name: test-renders
          path: renders/*.wav

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build tross303~.mxo (arm64 + x86_64)
        run: |
          set -o pipefail
          cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --config Release 2>&1 | tee build.log || { grep -E "error:" build.log | sort -u | head -15 | sed 's/^/::error::/'; exit 1; }
          ls -la externals
          lipo -info "externals/tross303~.mxo/Contents/MacOS/tross303~"
          codesign -dv "externals/tross303~.mxo" || true
      - name: Pack
        run: cd externals && ditto -c -k --keepParent "tross303~.mxo" ../mxo.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac-external
          path: mxo.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build tross303~.mxe64
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 2>&1 | tee configure.log || { grep -i "error" configure.log | head -15 | sed 's/^/::error::/'; exit 1; }
          cmake --build build --config Release 2>&1 | tee build.log || { grep -E "error|fatal" build.log | sort -u | head -15 | sed 's/^/::error::/'; exit 1; }
          ls -la externals
      - uses: actions/upload-artifact@v4
        with:
          name: win-external
          path: externals/tross303~.mxe64

  package:
    needs: [tests, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Assemble the device folder
        run: |
          pip install reportlab
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="dev-${GITHUB_SHA::7}"
          D="dist/TRoss 303"
          mkdir -p "$D"
          python3 tools/make_device.py "$D/TRoss 303.amxd"
          cp device/tross303_panel.js "$D/"
          (cd "$D" && unzip -q ../../art/mac-external/mxo.zip)
          cp "art/win-external/tross303~.mxe64" "$D/"
          python3 tools/make_manual.py "$D/TRoss303_Manual.pdf"
          cp "$D/TRoss303_Manual.pdf" dist/
          cp LICENSE "$D/LICENSE.txt"
          cat > "$D/README.txt" <<'EOF'
          TRoss 303 - Acid Bass for Max for Live, by Ticco Ross
          https://ticcoross.gumroad.com/  -  ticcoross@gmail.com

          1. Drag this whole folder into Live's User Library (keep the files together).
          2. macOS, once, in Terminal:
               xattr -dr com.apple.quarantine "<path to this folder>"
          3. Drop "TRoss 303.amxd" on a MIDI track.

          Full instructions: TRoss303_Manual.pdf
          Source code (GNU AGPL v3): https://github.com/Spunkmeyer77/TRoss303
          EOF
          (cd dist && zip -qr "TRoss303-${VERSION}.zip" "TRoss 303")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -laR dist
      - uses: actions/upload-artifact@v4
        with:
          name: TRoss303-${{ env.VERSION }}
          path: dist/TRoss 303
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TRoss 303 ${{ github.ref_name }}
          files: |
            dist/TRoss303-${{ env.VERSION }}.zip
            dist/TRoss303_Manual.pdf
          body: |
            **TRoss 303** — TB-303 style bass synth and sequencer for Max for Live.

            Download **TRoss303-${{ env.VERSION }}.zip** (device + Mac and Windows engine + manual).
            The user manual is also attached as **TRoss303_Manual.pdf**.

            Install: drag the unzipped "TRoss 303" folder into Live's User Library; on macOS run once
            `xattr -dr com.apple.quarantine "<path to the folder>"`; drop "TRoss 303.amxd" on a MIDI track.
